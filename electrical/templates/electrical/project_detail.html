<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Detail</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'electrical/css/add_data.css' %}">
</head>

{% block content %}
<div class="container mt-5">
    <div class="mb-3">
        <label class="form-label"><strong>Name</strong></label>
        <p>{{ project.name }}</p>
    </div>
    <div class="mb-3">
        <label class="form-label"><strong>Date</strong></label>
        <p>{{ project.date }}</p>
    </div>
    <div class="mb-3">
        <label class="form-label"><strong>Description</strong></label>
        <p>{{ project.description }}</p>
    </div>
    <div class="mb-3">
        <label class="form-label"><strong>Picture</strong></label>
        {% if project.picture %}
            <img src="{{ project.picture.url }}" alt="{{ project.name }}" class="img-fluid" style="max-width: 100px; height: 200px;">
        {% endif %}
    </div>
    <div class="mb-3">
        <label class="form-label"><strong>Skills</strong></label>
        <p>{{ project.skills }}</p>
        </div>
    </div>
    <div class="mb-3">
        <a href="{% url 'project_edit' project.id %}" class="btn btn-primary">Edit Project</a>
        <a href="{% url 'project_delete' project.id %}" class="btn btn-danger">Delete Project</a>
    </div>
</div>

<footer class="mt-5">
    <a href="{% url 'index' %}" class="btn btn-info">Back to Home</a>
</footer>
{% endblock %}
