<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit — {{ project.name }}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'electrical/css/style.css' %}">
</head>
<body>
    <main class="site-main form-page">
        <header class="page-header">
            <h1>Edit project</h1>
        </header>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="stack">
                <div class="field">
                    <label for="name" class="form-label">Project name</label>
                    <input type="text" class="form-control" id="name" name="name" value="{{ project.name }}" required>
                </div>
                <div class="field">
                    <label for="description" class="form-label">Description</label>
                    <textarea class="form-control" id="description" name="description" rows="4">{{ project.description }}</textarea>
                </div>
                <div class="field">
                    <label for="date" class="form-label">Date</label>
                    <input type="date" class="form-control" id="date" name="date" value="{{ project.date|date:'Y-m-d' }}" required>
                </div>
                <div class="field">
                    <label for="picture" class="form-label">Picture</label>
                    <input type="file" class="form-control" id="picture" name="picture" accept="image/*">
                    {% if project.picture_url %}
                        <img src="{{ project.picture_url }}" alt="{{ project.name }}" class="detail-image" loading="lazy">
                    {% endif %}
                </div>
                <div class="field">
                    <label for="skills" class="form-label">Skills (comma-separated)</label>
                    <input type="text" class="form-control" id="skills" name="skills" value="{{ project.skills|default:'' }}" placeholder="e.g. Python, SCADA">
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save changes</button>
                <a href="{% url 'project_detail' project.id %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </main>
</body>
</html>
