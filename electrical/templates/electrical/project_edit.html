<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Edit</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'electrical/css/project_edit.css' %}">
</head>

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h2>Edit Project</h2>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="form-group mb-3">
                    <label for="name">Project Name</label>
                    <input type="text" class="form-control" id="name" name="name" value="{{ project.name }}" required>
                </div>
                <div class="form-group mb-3">
                    <label for="description">Description</label>
                    <textarea class="form-control" id="description" name="description" rows="4">{{ project.description }}</textarea>
                </div>
                <div class="form-group mb-3">
                    <label for="date">Date</label>
                    <input type="date" class="form-control" id="date" name="date" value="{{ project.date|date:'Y-m-d' }}" required>
                </div>  
                <div class="form-group mb-3">
                    <label for="picture">Picture</label>
                    <input type="file" class="form-control" id="picture" name="picture" accept="image/*">
                    {% if project.picture %}
                        <div class="mt-3">
<<<<<<< HEAD
                            <img src="{{ project.picture.url }}" alt="{{ project.name }}" class="img-fluid rounded" style="max-width: 400px; height: 200px;">
=======
                            <img src="{{ project.picture_url }}" alt="{{ project.name }}" class="img-fluid rounded" style="max-width: 100px; height: 200px;">
>>>>>>> 0029562 (fix something)
                        </div>
                    {% endif %}
                </div>
                <div class="form-group mb-3">
                    <label for="skills">Skills (comma-separated)</label>
                    <input type="text" class="form-control" id="skills" name="skills" value="{{ project.skills }}" placeholder="Enter skills separated by commas">
                </div>
                <div class="form-group mb-3">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <script>
                        document.querySelector('form').addEventListener('submit', function(e) {
                            e.preventDefault();
                            this.submit();
                            alert('It is saved. Click go back to return');
                        });
                    </script>
                    <a href="{% url 'project_detail' project.id %}" class="btn btn-secondary">Go back</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
