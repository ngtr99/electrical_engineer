<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Project</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'electrical/css/add_data.css' %}">
</head>

{% block content %}
<div class="container mt-5">

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" name="name" required>
        </div>
        <div class="mb-3">
            <label for="date" class="form-label">Date</label>
            <input type="date" class="form-control" id="date" name="date" required>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" name="description" rows="4"></textarea>
        </div>
        <div class="mb-3">
            <label for="picture" class="form-label">Picture</label>
                <input type="file" class="form-control" id="picture" name="picture" accept="image/*">
                {% if project and project.picture %}
                    <div class="mt-3">
                        <img src="{{ project.picture.url }}" alt="{{ project.name }}" class="img-fluid rounded" style="max-width: 200px; height: auto;">
                    </div>
                {% endif %}
        </div>
        <div class="mb-3">
            <label for="skills" class="form-label">Skills</label>
            <input type="text" class="form-control" id="skills" name="skills" placeholder="Enter skills separated by commas">
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>

    </form>

</div>


    <footer class="mt-5">
        <a href="{% url 'index' %}" class="btn btn-info">Back to Home</a>
    </footer>

{% endblock %}
